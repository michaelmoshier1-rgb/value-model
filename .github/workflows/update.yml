name: Update value model

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # backup timer; cron-job.org is the main trigger
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: value-model
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run model
        env:
          TZ: America/New_York
        run: python value_model.py --no-open
      - name: Save bets, closing lines and season data
        run: |
          git config user.name "value-bot"
          git config user.email "value-bot@users.noreply.github.com"
          git add value_data.json cache
          git commit -m "Update value data" || echo "No changes"
          git pull --rebase || true
          git push
      - name: Prepare web page
        run: |
          mkdir -p site
          cp value_model.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
